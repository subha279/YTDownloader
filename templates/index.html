<form action="/download" method="post">

<input
type="text"
name="url"
placeholder="Paste URL"
required>

<br><br>

<select name="type" id="typeSelect">
    <option value="video">Video</option>
    <option value="mp3">MP3</option>
</select>

<br><br>

<div id="videoOptions">

<select name="quality">
    <option value="144">144p</option>
    <option value="360">360p</option>
    <option value="480">480p</option>
    <option value="720">720p</option>
    <option value="1080">1080p</option>
</select>

</div>

<div id="mp3Options" style="display:none;">

<select name="mp3_quality">
    <option value="128">128 kbps</option>
    <option value="192">192 kbps</option>
    <option value="256">256 kbps</option>
    <option value="320">320 kbps</option>
</select>

</div>

<br><br>

<button type="submit">
Download
</button>

</form>


<script>

const typeSelect = document.getElementById("typeSelect");

typeSelect.addEventListener("change", function(){

    if(this.value==="mp3"){
        document.getElementById("videoOptions").style.display="none";
        document.getElementById("mp3Options").style.display="block";
    }
    else{
        document.getElementById("videoOptions").style.display="block";
        document.getElementById("mp3Options").style.display="none";
    }

});

</script>
